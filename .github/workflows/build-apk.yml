name: Build Custom APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          cache: true

      - name: Create Dummy .env
        run: |
          echo "ENABLE_HEALTH_DATA_CONTRIBUTION=false" > .env
          echo "COMPANION_URL=" >> .env
          echo "BACKEND_URL=" >> .env

      - name: Configure Persistent Release Keystore
        run: |
          mkdir -p android/app
          if [ ! -f android/app/poohw.jks ]; then
            echo "Generating persistent keystore..."
            keytool -genkeypair -v -keystore android/app/poohw.jks \
              -alias poohw -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass poohwkeystore -keypass poohwkeystore \
              -dname "CN=Poohw, OU=App, O=Poohw, L=Rome, S=Italy, C=IT"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -f android/app/poohw.jks
            git commit -m "chore(ci): commit persistent release keystore" || true
            git push origin main || true
          fi
          cat << 'EOF' > android/key.properties
          storeFile=poohw.jks
          storePassword=poohwkeystore
          keyAlias=poohw
          keyPassword=poohwkeystore
          EOF

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Android ARM64 Release APK
        run: flutter build apk --release --target-platform android-arm64 --dart-define-from-file=.env --dart-define=ENABLE_SIDELOAD_OTA=true

      - name: Prepare APK Asset
        run: |
          cd build/app/outputs/flutter-apk
          cp app-release.apk poohw-arm64.apk || cp *.apk poohw-arm64.apk
          cp poohw-arm64.apk openstrap-custom-arm64.apk
          ls -la

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: poohw-apk
          path: build/app/outputs/flutter-apk/poohw-arm64.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          TAG="v$VERSION"
          echo "Releasing version: $VERSION with tag: $TAG"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --title "Poohw v$VERSION" \
            --notes "Poohw: Personal build with Liquid Metal & Crimson design system, 3D icon, prioritized Live Heart Rate, and automatic in-app OTA update detection."
          gh release upload "$TAG" build/app/outputs/flutter-apk/poohw-arm64.apk --clobber
          gh release upload "$TAG" build/app/outputs/flutter-apk/openstrap-custom-arm64.apk --clobber
